name: Quality gates
on: [push, pull_request]
jobs:
  numerical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make setup
      - run: make check
      - run: make eval
      - uses: actions/upload-artifact@v4
        with:
          name: measured-evaluation
          path: eval/results/
