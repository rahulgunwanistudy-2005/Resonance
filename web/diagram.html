<!doctype html><html><head><meta charset="UTF-8"><title>Diagram renderer</title></head><body><main id="figure"></main><script type="module">import mermaid from 'mermaid';mermaid.initialize({startOnLoad:false,theme:'neutral',securityLevel:'strict',fontFamily:'Arial'});window.renderDiagram=async(source)=>{const {svg}=await mermaid.render('diagram',source);document.querySelector('#figure').innerHTML=svg;return svg};</script></body></html>
